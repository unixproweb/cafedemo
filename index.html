<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CAFÉ/9 · Menú</title>
<meta name="description" content="Café de especialidad, frío y caliente. Pide por WhatsApp.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1a1f;--cream:#f0e8e0;--flav:#d9a35b;--ease:cubic-bezier(.22,.8,.24,1);box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.disp{font-family:"Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:.92}
.mono{font-family:"DM Mono",monospace}
nav{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 18px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.06em;font-size:15px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
#basket{position:relative;height:38px;padding:0 14px;border:1.5px solid var(--ink);border-radius:99px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;background:rgba(255,255,255,.25);backdrop-filter:blur(8px)}
#basket.bump{animation:bk .32s}
@keyframes bk{50%{transform:scale(1.18)}}
#badge{background:var(--ink);color:#fff;font:500 10.5px "DM Mono",monospace;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
#badge.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}}
#hero{position:relative;min-height:100svh;background:var(--flav);overflow:hidden;display:flex;flex-direction:column;padding-top:calc(64px + env(safe-area-inset-top,0px))}
#hero.dragging{cursor:grabbing}
.reveal{position:absolute;inset:0;clip-path:circle(0 at 50% 40%);pointer-events:none}
.rings{position:absolute;left:50%;top:40%;width:1500px;height:1500px;transform:translate(-50%,-50%);background:repeating-radial-gradient(circle,rgba(255,255,255,.14) 0,rgba(255,255,255,.02) 30px,rgba(255,255,255,.14) 60px);-webkit-mask-image:radial-gradient(circle,#000 0 22%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,transparent 52%);animation:rin 1.1s ease-out both}
@keyframes rin{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
#count{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));right:14px;font-size:92px;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);z-index:1;pointer-events:none}
.arc{position:relative;flex:0 0 46svh;touch-action:pan-y;cursor:grab;z-index:2}
.hc{position:absolute;left:50%;top:50%;overflow:hidden;will-change:transform;background:#fff;box-shadow:0 22px 30px -16px rgba(30,18,40,.45);clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.hc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.info{position:relative;z-index:3;text-align:center;padding:6px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:10px}
#title{font-size:min(12.5vw,60px);color:var(--ink);padding-bottom:4px}
#title .w{display:inline-block;white-space:nowrap;margin:0 .12em}
#title .l{display:inline-block;overflow:hidden;vertical-align:top}
#title .l i{display:inline-block;font-style:normal;animation:up .62s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{transform:translateY(110%);opacity:0}}
#desc{font:400 13px/1.45 "DM Mono",monospace;max-width:330px;transition:opacity .25s,translate .25s}
.sw{opacity:0;translate:0 10px}
.act{display:flex;align-items:center;gap:12px}
.ctl{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(40,28,60,.12);transition:transform .2s}
.ctl:hover{transform:scale(1.08)}.ctl:active{transform:scale(.94)}
.ctl svg{width:18px;height:18px}
.btn{height:52px;min-width:190px;padding:0 24px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn small{font:500 12px "DM Mono",monospace;opacity:.7}
.step{display:none;height:52px;min-width:190px;border-radius:99px;background:var(--ink);color:#fff;align-items:center;justify-content:space-between;padding:0 6px}
.step button{width:44px;height:44px;font-size:22px;color:#fff}
.step b{font:500 15px "DM Mono",monospace}
.has>.btn{display:none}.has>.step{display:flex}
#auto{position:absolute;right:16px;top:calc(176px + env(safe-area-inset-top,0px));z-index:4;display:flex;align-items:center;gap:8px;color:#fff;font:500 11px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
#auto span{width:26px;height:26px;border:1.3px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:9px}
section.shop{padding:64px 16px 40px;max-width:1000px;margin:0 auto}
.shop h2{font-size:clamp(48px,13vw,94px);margin-bottom:12px}
.shop .cap{font:400 13.5px/1.42 "DM Mono",monospace;max-width:300px;margin-bottom:22px}
#chips{display:flex;gap:6px;margin-bottom:16px}
.pill{height:36px;padding:0 17px;border-radius:99px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;perspective:1200px}
@media(min-width:700px){#grid{grid-template-columns:repeat(3,1fr)}}
.item{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.item.in{opacity:1;transform:none}
.item img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.item .b{padding:12px 12px 12px;display:flex;flex-direction:column;flex:1;gap:4px}
.item h3{font-size:19px;color:#fbf7f2}
.item p{font:400 11.5px/1.4 "DM Mono",monospace;color:rgba(255,255,255,.88);flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px}
.price{font:500 14px "DM Mono",monospace;color:#fff}
.tag{font:500 10px "DM Mono",monospace;background:rgba(255,255,255,.85);padding:2px 5px;text-transform:uppercase;border-radius:3px}
.item .act2{display:flex}
.add{width:100%;height:40px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
.st{display:none;width:100%;height:40px;border-radius:99px;background:var(--ink);color:#fff;align-items:center;justify-content:space-between}
.st button{width:44px;height:40px;font-size:18px;color:#fff}
.item.has .add{display:none}.item.has .st{display:flex}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
#tot{flex:1;font:400 11px "DM Mono",monospace;color:#7b7e84;text-transform:uppercase;letter-spacing:.05em}
#tot b{display:block;font:400 22px "Archivo Black",sans-serif;color:var(--ink);letter-spacing:0}
#tot.bump b{animation:bmp .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bmp{40%{transform:translateY(-6px) scale(1.25)}}
#bar .btn{min-width:0;height:46px;font-size:14px}
#sheet{position:fixed;inset:0;z-index:60;visibility:hidden}
#sheet.open{visibility:visible}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
#sheet.open #shade{opacity:1}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:#fff;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .45s cubic-bezier(.65,0,.25,1);max-width:600px;margin:0 auto;border-radius:22px 22px 0 0}
#sheet.open #panel{transform:none}
#panel h2{font:400 22px "Archivo Black",sans-serif;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:10px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e3e3e6;font-size:13px;font-weight:500}
.line span{flex:1}.line .q{display:flex;align-items:center;background:#eceef1;border-radius:99px}
.line .q button{width:34px;height:34px;font-size:16px}.line .q i{font-style:normal;min-width:20px;text-align:center}
.line em{font:normal 400 12px "DM Mono",monospace;min-width:62px;text-align:right}
.empty{font:400 13px/1.5 "DM Mono",monospace;color:#7b7e84;padding:14px 0}
.total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding:14px 0;font:400 17px "Archivo Black",sans-serif;text-transform:uppercase}
.field{width:100%;height:42px;background:#eceef1;padding:0 14px;font:400 12.5px "DM Mono",monospace;color:var(--ink);border:0;outline:0;margin-bottom:6px;border-radius:99px}
.wa{width:100%;height:50px;background:#1f9d55;color:#fff;font-weight:700;font-size:15px;border-radius:99px;margin-top:8px}
.wa:disabled{opacity:.4}
.mesa{background:#eceef1;border-radius:18px;padding:12px;margin-bottom:10px}
.mesa label{display:block;font:500 11px "DM Mono",monospace;letter-spacing:.1em;margin-bottom:8px}
.mrow{display:flex;gap:8px}
.mrow .field{margin:0;background:#fff;flex:0 0 96px;text-align:center;font-size:18px;height:46px}
.mrow .field:disabled{opacity:.7}
.cf{flex:1;height:46px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
.cf:disabled{opacity:.35}
.cf.ok{background:#1f9d55}
.mmsg{font:400 11px/1.4 "DM Mono",monospace;color:#7b7e84;margin-top:8px}
.mmsg.ok{color:#1f7a45}
.note{font:400 10.5px "DM Mono",monospace;color:#7b7e84;text-transform:uppercase;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const ITEMS=[

{n:"Cold brew",d:"Infusión en frío por 18 horas, con hielo.",p:65,c:"frio",col:"#b98a5e"},
{n:"Americano helado",d:"Espresso doble con agua fría y crema.",p:55,c:"frio",col:"#9a7a5e"},
{n:"Matcha latte helado",d:"Matcha ceremonial con leche fría.",p:80,c:"frio",col:"#9db57a"},
{n:"Latte helado",d:"Espresso, leche y hielo en capas.",p:70,c:"frio",col:"#d3b896"},
{n:"Latte caramelo helado",d:"Espresso, leche cremosa y caramelo.",p:75,c:"frio",col:"#c9a27c"},
{n:"Cold brew cremoso",d:"Cold brew con espuma de leche fría.",p:85,c:"frio",t:"Favorito",col:"#a9795a"},
{n:"Capuchino",d:"Espresso con leche vaporizada y arte latte.",p:60,c:"caliente",col:"#c28a54"},
{n:"Espresso",d:"Un shot intenso, con su crema dorada.",p:45,c:"caliente",col:"#b57a4d"}
];
const N=ITEMS.length,q={};const $=s=>document.querySelector(s);
const money=n=>"$"+n.toLocaleString("es-MX");
const mod=(a,n)=>((a%n)+n)%n;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const hero=$("#hero"),arc=$("#arc"),grid=$("#grid");
let pos=1,target=1,cur=1,cw=240,drag=null,anim=0,lastInt=Date.now(),autoOn=!reduce;

/* hero cards */
const cards=ITEMS.map((it,j)=>{const e=document.createElement("div");e.className="hc";e.innerHTML=`<img src="${IMG[j]}" alt="${it.n}">`;arc.appendChild(e);return e});
function layout(){const h=arc.clientHeight;cw=Math.min(innerWidth*.5,h*.8*.8,300);cards.forEach(e=>{e.style.width=cw+"px";e.style.height=cw*1.25+"px"});place()}
function place(){
 cards.forEach((e,j)=>{
  const k=mod(j-pos+N/2,N)-N/2,a=Math.abs(k),s=Math.sign(k);
  const x=s*Math.min(a,1)*cw*.62+s*Math.max(0,Math.min(a,4)-1)*cw*.4;
  const y=a*cw*.08,sc=Math.max(.5,1-a*.16),rz=k*4;
  e.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) rotate(${rz}deg) scale(${sc})`;
  e.style.opacity=a<=2.3?1:Math.max(0,1-(a-2.3)/.8);
  e.style.zIndex=20-Math.round(a*3);
  e.dataset.k=k;
 });
}
const ease=t=>{ // glide curve approximation
 return 1-Math.pow(1-t,3.2)};
function goTo(t){
 target=t;const from=pos,to=t,dur=reduce?1:Math.max(380,650+160*(Math.abs(to-from)-1));
 const t0=performance.now();cancelAnimationFrame(anim);
 const idx=mod(t,N);if(idx!==cur)setTimeout(()=>changeFlavour(idx),reduce?0:Math.min(90,dur*.12));
 (function f(now){const p=Math.min(1,(now-t0)/dur);pos=from+(to-from)*ease(p);place();if(p<1)anim=requestAnimationFrame(f)})(t0);
 lastInt=Date.now();
}
/* flavour change */
function setTitle(name,dir){
 const el=$("#title");let i=0;
 el.innerHTML=name.split(" ").map(w=>`<span class="w">${[...w].map(ch=>`<span class="l"><i style="animation-delay:${reduce?0:120+22*(i++)}ms">${ch}</i></span>`).join("")}</span>`).join(" ");
}
function changeFlavour(idx){
 cur=idx;const it=ITEMS[idx];
 const rv=$(".reveal");rv.style.background=it.col;
 if(!reduce){
  const a=rv.animate([{clipPath:"circle(0px at 50% 40%)"},{clipPath:"circle(150vmax at 50% 40%)"}],{duration:480,easing:"cubic-bezier(.25,.75,.2,1)"});
  a.onfinish=()=>{hero.style.setProperty("--flav",it.col)};
 }else hero.style.setProperty("--flav",it.col);
 setTitle(it.n);
 const c=$("#count"),d=$("#desc");d.classList.add("sw");
 setTimeout(()=>{c.textContent=String(idx+1).padStart(2,"0");d.textContent=it.d;d.classList.remove("sw");$("#hp").textContent=money(it.p);refresh()},reduce?0:160);
}
/* drag */
arc.addEventListener("pointerdown",e=>{if(e.button)return;drag={x:e.clientX,p0:pos,on:false,v:0,lx:e.clientX,lt:performance.now(),id:e.pointerId,tgt:e.target}});
arc.addEventListener("pointermove",e=>{
 if(!drag)return;const dx=e.clientX-drag.x;lastInt=Date.now();
 if(!drag.on&&Math.abs(dx)>6){drag.on=true;cancelAnimationFrame(anim);arc.setPointerCapture(drag.id);hero.classList.add("dragging")}
 if(drag.on){const now=performance.now(),v=(drag.lx-e.clientX)/(cw*.62)/Math.max(8,now-drag.lt);drag.v=drag.v*.6+v*.4;drag.lx=e.clientX;drag.lt=now;pos=drag.p0-dx/(cw*.62);place()}
});
function endDrag(e,cancel){
 if(!drag)return;const d=drag;drag=null;hero.classList.remove("dragging");
 if(d.on){const t=Math.round(pos+Math.max(-2,Math.min(2,d.v*220)));goTo(t);}
 else if(!cancel){const c=e.target.closest(".hc");if(c){const k=Math.round(+c.dataset.k);if(k)goTo(target+k)}}
}
arc.addEventListener("pointerup",e=>endDrag(e));
arc.addEventListener("pointercancel",e=>endDrag(e,true));
$("#next").onclick=()=>goTo(target+1);$("#prev").onclick=()=>goTo(target-1);
addEventListener("keydown",e=>{const r=hero.getBoundingClientRect();if(r.bottom<innerHeight*.5||r.top>innerHeight*.5)return;if(e.key==="ArrowRight")goTo(target+1);if(e.key==="ArrowLeft")goTo(target-1)});
/* autoplay */
$("#auto").onclick=()=>{autoOn=!autoOn;$("#auto").setAttribute("aria-pressed",autoOn);$("#auto span").textContent=autoOn?"❚❚":"▶"};
setInterval(()=>{if(!autoOn||document.hidden||drag||sheet.classList.contains("open"))return;const r=hero.getBoundingClientRect();if(Math.min(r.bottom,innerHeight)-Math.max(r.top,0)<innerHeight*.6)return;if(Date.now()-lastInt>=3200){goTo(target+1)}},400);
if(reduce)$("#auto span").textContent="▶";

/* shop grid */
ITEMS.forEach((it,k)=>{
 const el=document.createElement("div");el.className="item";el.dataset.c=it.c;el.dataset.k=k;el.style.background=it.col;el.style.transitionDelay=(k%3)*80+"ms";
 el.innerHTML=`<img src="${IMG[k]}" alt="${it.n}" loading="lazy"><div class="b"><h3 class="disp">${it.n}</h3><p>${it.d}</p>
 <div class="row"><span class="price">${money(it.p)}</span>${it.t?`<span class="tag">${it.t}</span>`:""}</div>
 <button class="add">Agregar</button><div class="st"><button data-d="-1" aria-label="Quitar">−</button><b class="n mono" style="color:#fff">0</b><button data-d="1" aria-label="Agregar">+</button></div></div>`;
 grid.appendChild(el);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
[...grid.children].forEach(c=>io.observe(c));

/* cart */
function fly(src){
 if(reduce||!src)return;const r=src.getBoundingClientRect(),b=$("#basket").getBoundingClientRect();
 const im=document.createElement("img");im.src=src.getAttribute("src");
 Object.assign(im.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",objectFit:"cover",zIndex:70,pointerEvents:"none",borderRadius:"10px",boxShadow:"0 10px 14px rgba(0,0,0,.25)"});
 document.body.appendChild(im);
 const dx=b.left+b.width/2-(r.left+r.width/2),dy=b.top+b.height/2-(r.top+r.height/2),k=Math.min(.2,30/r.height);
 im.animate([{transform:"none",opacity:1},{transform:`translate(${dx*.4}px,${dy*.4-Math.min(160,.35*Math.abs(dy)+60)}px) scale(${.45+k}) rotate(-10deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(-18deg)`,opacity:.15}],{duration:900,easing:"cubic-bezier(.5,0,.2,1)"}).onfinish=()=>{im.remove();const bk=$("#basket");bk.classList.remove("bump");void bk.offsetWidth;bk.classList.add("bump")};
}
function change(k,d,src){
 const nv=Math.max(0,(q[k]||0)+d);if(nv===(q[k]||0))return;q[k]=nv;if(d>0)fly(src);update(true);
}
function refresh(){
 const n=q[cur]||0;$("#hadd").classList.toggle("has",n>0);$("#hn").textContent=n;
}
function update(bump){
 let sum=0,cnt=0,html="";
 ITEMS.forEach((it,k)=>{
  const n=q[k]||0,el=grid.children[k];
  el.classList.toggle("has",n>0);el.querySelector(".n").textContent=n;
  if(n){sum+=n*it.p;cnt+=n;html+=`<div class="line"><span>${it.n}</span><div class="q"><button data-k="${k}" data-d="-1">−</button><i>${n}</i><button data-k="${k}" data-d="1">+</button></div><em>${money(n*it.p)}</em></div>`}
 });
 $("#sum").textContent=$("#sum2").textContent=money(sum);$("#cnt").textContent=cnt;
 const bd=$("#badge");if(bd.textContent!=cnt){bd.textContent=cnt;bd.classList.remove("pop");void bd.offsetWidth;bd.classList.add("pop")}
 $("#lines").innerHTML=html||'<div class="empty">Aún no has agregado nada. Elige tus bebidas del menú.</div>';
 syncWa();refresh();
 if(bump){const t=$("#tot");t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump")}
}
$("#hadd").addEventListener("click",e=>{
 const src=cards[cur].querySelector("img");
 if(e.target.closest(".btn"))change(cur,1,src);
 else{const b=e.target.closest("[data-d]");if(b)change(cur,+b.dataset.d,src)}
});
grid.addEventListener("click",e=>{
 const el=e.target.closest(".item");if(!el)return;const k=+el.dataset.k,img=el.querySelector("img");
 if(e.target.closest(".add"))change(k,1,img);
 else{const b=e.target.closest("[data-d]");if(b)change(k,+b.dataset.d,img)}
});
$("#lines").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)change(+b.dataset.k,+b.dataset.d)});
$("#chips").addEventListener("click",e=>{
 const b=e.target.closest(".pill");if(!b)return;
 document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p===b));
 [...grid.children].forEach(c=>c.style.display=(b.dataset.f==="all"||c.dataset.c===b.dataset.f)?"":"none");
});

$("#open").onclick=$("#basket").onclick=()=>sheet.classList.add("open");
$("#close").onclick=$("#shade").onclick=()=>sheet.classList.remove("open");
let tableOk=null;
function syncWa(){const c=Object.values(q).reduce((a,b)=>a+b,0),w=$("#wa");const nmOk=$("#nm").value.trim().length>0;w.disabled=!c||!tableOk||!nmOk;w.textContent=!c?"Pedir por WhatsApp":!tableOk?"Confirma tu mesa para continuar":!nmOk?"Escribe tu nombre para continuar":"Pedir por WhatsApp"}
const tb=$("#tb"),cf=$("#cf"),mm=$("#mmsg");
tb.addEventListener("input",()=>{tb.value=tb.value.replace(/\D/g,"").replace(/^0+/,"");tableOk=null;cf.classList.remove("ok");cf.disabled=!tb.value;cf.textContent="Confirmar mesa";mm.className="mmsg";mm.textContent=tb.value?"Presiona confirmar para validar la mesa "+tb.value+".":"Escribe tu mesa y confírmala para continuar.";syncWa()});
cf.onclick=()=>{if(tableOk){tableOk=null;tb.disabled=false;cf.classList.remove("ok");cf.textContent="Confirmar mesa";mm.className="mmsg";mm.textContent="Cambia tu mesa y confírmala de nuevo."}else if(tb.value){tableOk=tb.value;tb.disabled=true;cf.classList.add("ok");cf.textContent="✓ Mesa "+tableOk+" · Cambiar";mm.className="mmsg ok";mm.textContent="Mesa "+tableOk+" confirmada. Tu pedido llegará a esa mesa."}syncWa()};
$("#nm").addEventListener("input",syncWa);
$("#wa").onclick=()=>{if(!tableOk||!$("#nm").value.trim())return;
 let sum=0,lines=[];
 ITEMS.forEach((it,k)=>{const n=q[k]||0;if(n){sum+=n*it.p;lines.push(`${n}x ${it.n} - ${money(n*it.p)}`)}});
 const nm=$("#nm").value.trim(),nt=$("#nt").value.trim();
 const msg=`Hola, quiero hacer un pedido en CAFÉ/9:\n*MESA: ${tableOk}*\n\n${lines.join("\n")}\n\nTotal: ${money(sum)}`+(nm?`\nNombre: ${nm}`:"")+(nt?`\nNotas: ${nt}`:"");
 window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
};
/* init */
addEventListener("resize",layout);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{});
hero.style.setProperty("--flav",ITEMS[1].col);
layout();setTitle(ITEMS[1].n);$("#count").textContent="02";$("#desc").textContent=ITEMS[1].d;$("#hp").textContent=money(ITEMS[1].p);
if(!reduce){pos=-2.6;const f0=performance.now();(function f(now){const p=Math.min(1,(now-f0)/1500);pos=-2.6+3.6*(1-Math.pow(1-p,4));place();if(p<1)requestAnimationFrame(f)})(f0)}
update(false);
</script>
</body>
</html>
